openapi: 3.1.0
info:
  title: Pars Poolad Aghaee Corporate Portal API
  version: 1.0.0
  description: >
    Modular RESTful API (Laravel 13 / Sanctum / Spatie RBAC) powering the corporate portal,
    dynamic theme engine, wellhead & downhole projects showcase, contracts, licenses, and RFQ workflows.
servers:
  - url: /api/v1
    description: API v1 Base Path
paths:
  /bootstrap:
    get:
      summary: Fetch initial public portal payload (themes, sliders, menus, KPIs, projects, licenses, settings)
      responses:
        '200':
          description: Successful bootstrap payload
  /auth/login:
    post:
      summary: Authenticate user and return Sanctum Bearer token (with optional 2FA check)
      responses:
        '200':
          description: Authenticated user and token
        '422':
          description: Invalid credentials or 2FA code
  /projects:
    get:
      summary: List projects with optional filters (category_id, status, year, q)
      responses:
        '200':
          description: Filtered list of engineering projects
  /contact:
    post:
      summary: Submit public contact inquiry or RFQ with CAPTCHA and honeypot validation
      responses:
        '201':
          description: Submission recorded and notification queued
        '422':
          description: Invalid form, CAPTCHA, or honeypot value
        '429':
          description: Public form rate limit exceeded
  /faqs:
    get:
      summary: List active FAQ entries managed through the admin CMS
      responses:
        '200':
          description: Active FAQs ordered by sort order
  /pages/{slug}:
    get:
      summary: Fetch a published, database-managed content page
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Page content and editable metadata
        '404':
          description: Page not found
  /admin/content-schema/{resource}:
    get:
      summary: Get the editable field definitions for a CMS resource
      security:
        - bearerAuth: []
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [categories, faqs, services, products, departments, team, partners, articles, pages, banners, kpis, notification-templates]
      responses:
        '200':
          description: Resource fields, types and required status
        '403':
          description: Required management permission missing
  /admin/{resource}:
    get:
      summary: List records for a managed CMS resource
      security:
        - bearerAuth: []
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CMS records
    post:
      summary: Create a record for a managed CMS resource
      security:
        - bearerAuth: []
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: CMS record created
        '422':
          description: Invalid CMS record
  /admin/{resource}/{id}:
    put:
      summary: Update a managed CMS record
      security:
        - bearerAuth: []
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: CMS record updated
        '422':
          description: Invalid CMS record
    delete:
      summary: Soft-delete a managed CMS record
      security:
        - bearerAuth: []
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: CMS record soft-deleted
  /articles/{slug}/comments:
    get:
      summary: List approved comments for a public article
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Approved comments only
    post:
      summary: Submit a comment for moderation using the self-hosted CAPTCHA
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Comment queued for moderation
        '422':
          description: Invalid form, CAPTCHA, or honeypot value
        '429':
          description: Public comment rate limit exceeded
  /page-views:
    post:
      summary: Record an anonymous public page view as a daily path aggregate
      responses:
        '202':
          description: Page view counted without storing visitor identifiers
        '422':
          description: Invalid path
  /admin/analytics:
    get:
      summary: Retrieve daily, monthly, and selected-range aggregate page views
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Aggregate analytics without visitor-level data
        '403':
          description: Analytics permission required
        '422':
          description: Invalid or incomplete date range
  /admin/comments:
    get:
      summary: List public article comments for moderation
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Comments ordered by most recent
        '403':
          description: Comment moderation permission required
  /admin/comments/{comment}:
    put:
      summary: Approve, reject, or return a comment to pending
      security:
        - bearerAuth: []
      parameters:
        - name: comment
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Updated moderation state
    delete:
      summary: Soft-delete a comment
      security:
        - bearerAuth: []
      parameters:
        - name: comment
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Comment removed from public and moderation lists
  /admin/messages/{message}:
    put:
      summary: Update the follow-up status and internal note for a contact message
      security:
        - bearerAuth: []
      parameters:
        - name: message
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Message status updated
        '403':
          description: Message management permission required
    delete:
      summary: Soft-delete a contact or RFQ message
      security:
        - bearerAuth: []
      parameters:
        - name: message
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Message removed from the administration list
        '403':
          description: Message management permission required
  /admin/faqs:
    get:
      summary: List FAQ entries for administration
      security:
        - bearerAuth: []
      responses:
        '200':
          description: FAQ records including inactive entries
    post:
      summary: Create an FAQ entry
      security:
        - bearerAuth: []
      responses:
        '201':
          description: FAQ created
        '422':
          description: Invalid FAQ data
  /admin/faqs/{id}:
    put:
      summary: Update an FAQ entry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: FAQ updated
    delete:
      summary: Soft-delete an FAQ entry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: FAQ soft-deleted
  /admin/theme:
    put:
      summary: Update active color palette, dark/light mode, and landing page theme variables
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Updated ThemeSettings resource
  /admin/projects:
    post:
      summary: Create a new engineering project
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Project created
  /admin/projects-export:
    get:
      summary: Download Excel (.xlsx) export of engineering projects
      security:
        - bearerAuth: []
      responses:
        '200':
          description: XLSX binary stream
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
