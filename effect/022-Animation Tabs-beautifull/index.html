<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Tabs</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- فراخوانی آیکون‌ها (Boxicons) -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

    <nav class="menu">
        <!-- دکمه‌های رادیویی مخفی برای مدیریت کلیک‌ها -->
        <input type="radio" name="nav-item" id="m-home" checked>
        <label for="m-home">
            <i class='bx bx-home'></i> Home
        </label>

        <input type="radio" name="nav-item" id="m-search">
        <label for="m-search">
            <i class='bx bx-search'></i> Search
        </label>

        <input type="radio" name="nav-item" id="m-notification">
        <label for="m-notification">
            <i class='bx bx-bell'></i> Notification
        </label>

        <input type="radio" name="nav-item" id="m-favorites">
        <label for="m-favorites">
            <i class='bx bx-heart'></i> Favorites
        </label>

        <input type="radio" name="nav-item" id="m-profile">
        <label for="m-profile">
            <i class='bx bx-user'></i> Profile
        </label>

        <!-- دایره متحرک (Selector) -->
        <div class="selector"></div>
    </nav>

</body>
</html>
