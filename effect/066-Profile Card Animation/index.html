<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <!-- بخش اطلاعات که با هاور بالا می‌آید -->
        <div class="card-body">
            <div class="card-content">
                <h2 class="title">Kundan Kumar</h2>
                <h3 class="subtitle">React Developer</h3>
                <p class="card-text">
                    Lorem ipsum dolor sit amet, consectetur adipisicing elit. Officiis tempora at rerum?
                </p>
            </div>
        </div>
        
        <!-- دکمه View که در حالت عادی دیده می‌شود -->
        <div class="view-btn">View Profile</div>
    </div>

</body>
</html>
