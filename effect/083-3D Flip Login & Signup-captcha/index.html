<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Flip Login & Signup</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="flip-container" id="flip-container">
        <div class="flipper">
            
            <!-- ================= وجه جلو: فرم لاگین ================= -->
            <div class="front">
                <div class="form-title">Login</div>
                
                <div class="form-input">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username">
                </div>
                
                <div class="form-input">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                </div>
                
                <!-- بخش کپچا (کلاس‌ها با JS هماهنگ شدند) -->
                <div class="captcha-section">
                    <label>Enter Captcha</label>
                    <div class="preview" id="captcha-preview"></div>
                    <div class="captcha-form">
                        <input type="text" id="captcha-input" placeholder="Enter captcha text">
                        <button class="captcha-refresh" id="captcha-refresh" type="button">
                            <i class="fa fa-refresh"></i>
                        </button>
                    </div>
                </div>
                
                <button id="login-btn" class="submit-btn">Login</button>
                
                <div class="switch-text">
                    Don't have an account? <a href="#" id="to-signup">Sign Up</a>
                </div>
            </div>

            <!-- ================= وجه پشت: فرم ثبت‌نام ================= -->
            <div class="back">
                <div class="form-title">Sign Up</div>
                
                <div class="form-input">
                    <label for="new-username">Username</label>
                    <input type="text" id="new-username" placeholder="Choose a username">
                </div>
                
                <div class="form-input">
                    <label for="new-email">Email</label>
                    <input type="email" id="new-email" placeholder="Enter your email">
                </div>
                
                <div class="form-input">
                    <label for="new-password">Password</label>
                    <input type="password" id="new-password" placeholder="Create a password">
                </div>
                
                <div class="form-input">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Repeat your password">
                </div>
                
                <button id="signup-btn" class="submit-btn">Sign Up</button>
                
                <div class="switch-text">
                    Already have an account? <a href="#" id="to-login">Login</a>
                </div>
            </div>

        </div>
    </div>

    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
