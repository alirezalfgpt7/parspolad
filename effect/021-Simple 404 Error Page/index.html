<html lang="en">
<head>

    <title>Simple 404 Error Page</title>
    
    <!-- فایل استایل اختصاصی خودمان -->

    <section class="page_404">
        <div class="container">
            <div class="row">
                <div class="col-sm-12">
                    <div class="col-sm-10 col-sm-offset-1 text-center">

                        <div class="four_zero_four_bg">

                        </div>
                        
                        <!-- بخش متن‌ها و دکمه -->
                        <div class="contant_box_404">

                </div>
