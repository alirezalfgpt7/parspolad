<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Hamburger Positioning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ====================================================
         محل قرارگیری منو: 
         برای تغییر موقعیت، فقط کلاسِ بعد از "menu-container" را تغییر دهید.
         
         گزینه‌های موجود:
         - pos-top-right    (بالا سمت راست)
         - pos-top-left     (بالا سمت چپ)
         - pos-bottom-right (پایین سمت راست)
         - pos-bottom-left  (پایین سمت چپ)
         - pos-center       (دقیقاً وسط صفحه)
    ===================================================== -->
    <div class="menu-container pos-top-right">
        
        <input type="checkbox" id="input-checkbox" class="input-checkbox" />
        
        <label for="input-checkbox" class="nav-button">
            <span></span>
        </label>
        
    </div>

</body>
</html>
